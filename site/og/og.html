<!doctype html>
<!-- Source of public/og.png, the 1200x630 share image. To regenerate it, render this file at
     1200x630 in a browser and save the screenshot as public/og.png. -->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #fbfaf8;
    color: #1c1917;
    font-family: Inter, sans-serif;
    padding: 72px 80px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 18px; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; }
  h1 { font-size: 64px; line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; max-width: 900px; }
  .lead { margin-top: 20px; font-size: 28px; color: #6b6560; }
  .code {
    display: inline-flex; gap: 28px; align-items: center;
    font-family: 'JetBrains Mono', monospace; font-size: 22px;
    padding: 18px 24px; border: 1px solid #e7e2dc; border-radius: 12px; background: #fff;
  }
  .key { color: #2f5bd3; } .str { color: #0a6e4f; } .num { color: #b4471b; } .arrow { color: #a8a29e; }
  .foot { display: flex; justify-content: space-between; align-items: center; font-size: 24px; color: #6b6560; }
</style>
</head>
<body>
  <div class="brand">
    <svg width="52" height="52" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1c1917"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#fbfaf8" stroke-width="2.5"/><circle cx="16" cy="16" r="3.2" fill="#6f93ff"/></svg>
    Open System One
  </div>
  <div>
    <h1>One open contract for System&nbsp;One model APIs</h1>
    <p class="lead">Switch models by changing a URL, not your code.</p>
  </div>
  <div class="foot">
    <div class="code">
      <span><span class="key">"type"</span>: <span class="str">"noul"</span></span>
      <span class="arrow">→</span>
      <span><span class="key">"noul"</span>: <span class="num">0.99</span></span>
    </div>
    <span>opensystemone.org</span>
  </div>
</body>
</html>
